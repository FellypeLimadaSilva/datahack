services:
  devcontainer:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    command: sleep infinity
    volumes:
      - ..:/workspaces/datahack:cached
    environment:
      WAREHOUSE_HOST: warehouse
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_DB: ${WAREHOUSE_DB:-datahack}
      WAREHOUSE_INGEST_PASSWORD: ${WAREHOUSE_INGEST_PASSWORD:?}
      WAREHOUSE_DBT_PASSWORD: ${WAREHOUSE_DBT_PASSWORD:?}
      DBT_PII_SALT: ${DBT_PII_SALT:?}
      DBT_TARGET: dev
    networks: [warehouse]
    depends_on:
      warehouse:
        condition: service_healthy
