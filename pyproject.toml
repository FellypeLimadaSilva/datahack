[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datahack-ingest"
version = "2.0.0"
description = "ELT da Rota do Diploma: ingestão INEP/IBGE, portões de qualidade, publicação atômica e exportação."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Fellype Lima da Silva" }]
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "psycopg[binary]>=3.1",
    "requests>=2.31",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "fsspec>=2024.2",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dbt = ["dbt-core==1.12.5", "dbt-postgres==1.11.0"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff==0.16.10",
    "sqlfluff>=3.0",
]

[project.scripts]
dh-ingest = "datahack_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "airflow/dags", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL"]
ignore = [
    "PLR0913",
    "PLR2004",
    "PLR0917",
    "S608",
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "S603", "S607", "S608", "PLC0415", "RUF012", "PLR0915"]
"src/datahack_ingest/publish.py" = ["S603"]
"src/datahack_ingest/cli.py" = ["PLR0911", "PLR0912"]
"src/datahack_ingest/normalize.py" = ["PLR0911"]
"src/datahack_ingest/transforms.py" = ["PLR0911", "PLR0912"]
"src/datahack_ingest/extractors/api.py" = ["PLR0912"]
"scripts/**" = ["S311", "RUF005"]
"airflow/dags/**" = ["PLC0415", "S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: exige PostgreSQL acessível (variáveis WAREHOUSE_*)",
]
