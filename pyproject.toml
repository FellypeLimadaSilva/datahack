[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datahack-ingest"
version = "0.4.0"
description = "Framework de ingestão ELT config-driven (Bronze) da plataforma de dados DataHack."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Fellype Lima da Silva" }]
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "requests>=2.31",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "fsspec>=2024.2",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "ijson>=3.2",
    "fastavro>=1.9",
    "defusedxml>=0.7",
    "zstandard>=0.22",
]

[project.optional-dependencies]
oracle = ["oracledb>=2.0"]
mssql = ["pymssql>=2.3"]
mysql = ["pymysql>=1.1"]
s3 = ["s3fs>=2024.2"]
azure = ["adlfs>=2024.2"]
gcs = ["gcsfs>=2024.2"]
dbt = ["dbt-core==1.12.5", "dbt-postgres==1.11.0"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff==0.16.10",
    "sqlfluff>=3.0",
    "pre-commit>=3.7",
]

[project.scripts]
dh-ingest = "datahack_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "airflow/dags", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL"]
ignore = [
    "PLR0913",
    "PLR2004",
    "PLR0917",
    "S608",
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "S603", "S607", "PLC0415", "RUF012"]
"src/datahack_ingest/cli.py" = ["PLR0911", "PLR0912"]
"src/datahack_ingest/normalize.py" = ["PLR0911"]
"src/datahack_ingest/transforms.py" = ["PLR0911", "PLR0912"]
"src/datahack_ingest/extractors/api.py" = ["PLR0912"]
"scripts/**" = ["S311"]
"airflow/dags/**" = ["PLC0415", "S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: exige PostgreSQL acessível (variáveis WAREHOUSE_*)",
]
