version: 1

sources:
  - name: lojas
    kind: file
    description: Cadastro de lojas (CSV, datas dd/mm/aaaa, cabeçalhos com acento).
    owner: dados@datahack
    tags: [exemplo, cadastro]
    load_strategy: full
    file: { path: sample/lojas.csv, format: csv }

  - name: produtos
    kind: file
    description: Catálogo de produtos (JSON aninhado em data.items).
    owner: dados@datahack
    tags: [exemplo, cadastro]
    load_strategy: merge
    primary_key: [produto_id]
    file: { path: sample/produtos.json, format: json, records_path: data.items, flatten_max_level: 1 }

  - name: vendas
    kind: file
    description: Itens de venda (Parquet, 1 linha = 1 item de cupom). Arquivos de ajuste atualizam via merge.
    owner: dados@datahack
    tags: [exemplo, fato]
    load_strategy: merge
    primary_key: [venda_id, item_seq]
    chunk_size: 100000
    pii_columns: [cliente_cpf]
    file: { path: "sample/vendas/*.parquet", format: parquet }

  - name: metas
    kind: file
    description: Metas mensais por loja (CSV com ';' e decimal pt-BR).
    owner: comercial@datahack
    tags: [exemplo, meta]
    load_strategy: full
    file: { path: sample/metas.csv, format: csv, sep: ";" }

  - name: estoque_foto
    kind: file
    description: Foto mensal de estoque (medida semiaditiva). Append-only; Silver deduplica.
    owner: dados@datahack
    tags: [exemplo, fato, semiaditivo]
    load_strategy: append
    file: { path: sample/estoque_foto.csv, format: csv }

  - name: api_exemplo_pedidos
    kind: api
    enabled: false
    description: Modelo de fonte REST — copie, ajuste e habilite.
    load_strategy: merge
    primary_key: [id]
    watermark_column: updated_at
    watermark_type: timestamp
    api:
      url: https://api.exemplo.com.br/v1/pedidos
      auth: { type: bearer, token_env: API_EXEMPLO_TOKEN }
      records_path: data
      incremental_param: updated_since
      pagination: { type: page, page_param: page, size_param: per_page, page_size: 200 }
      rate_limit_per_second: 5

  - name: erp_notas_fiscais
    kind: sql
    enabled: false
    description: Modelo de fonte SQL incremental — URL SQLAlchemy em ERP_DB_URL.
    load_strategy: merge
    primary_key: [nota_id]
    watermark_column: dt_atualizacao
    watermark_type: timestamp
    chunk_size: 20000
    sql:
      url_env: ERP_DB_URL
      query: >-
        SELECT nota_id, numero, serie, emitente_cnpj, valor_total, dt_emissao, dt_atualizacao
        FROM erp.notas_fiscais

  - name: logs_eventos_lake
    kind: file
    enabled: false
    sink: parquet
    description: Modelo para alto volume (Parquet particionado em DH_LAKE_URI).
    load_strategy: append
    chunk_size: 250000
    file: { path: "eventos/*.jsonl", format: jsonl, flatten_max_level: 2 }
