name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint, segredos e configuração
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Catálogo de fontes
        run: python -m datahack_ingest list && python -m datahack_ingest validate
      - name: Docker Compose (sintaxe e variáveis)
        run: |
          python scripts/init_env.py
          docker compose config -q
          docker compose --profile tools --profile cli config -q
      - name: Gitleaks (varredura de segredos no histórico)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: Ingestão, portões, publicação e restauração (PostgreSQL 16)
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: datahack
          POSTGRES_USER: dh_admin
          POSTGRES_PASSWORD: ci_admin_pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dh_admin -d datahack"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      WAREHOUSE_HOST: localhost
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_DB: datahack
      WAREHOUSE_INGEST_PASSWORD: ci_ingest_pw
      WAREHOUSE_DBT_PASSWORD: ci_dbt_pw
      WAREHOUSE_BI_PASSWORD: ci_bi_pw
      DBT_PII_SALT: ci_salt
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
      DBT_TARGET: dev
      DH_LOG_FORMAT: json
      DH_E2E: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -e ".[dev,dbt]"
      - name: Bootstrap do warehouse (duas vezes, para provar que é idempotente)
        env: { PGPASSWORD: ci_admin_pw }
        run: |
          for i in 1 2; do
            psql -q -v ON_ERROR_STOP=1 -h localhost -U dh_admin -d datahack \
              -v dbname=datahack -v ingest_pw=ci_ingest_pw -v dbt_pw=ci_dbt_pw -v bi_pw=ci_bi_pw \
              -v backup_pw=ci_backup_pw -f infra/postgres/bootstrap.sql
          done
      - name: Testes (unidade, integração e ponta a ponta com rejeição e rollback)
        run: pytest -q --cov=datahack_ingest --cov-report=term-missing
      - name: Pipeline com arquivos no layout do INEP (duas execuções)
        env: { DH_CATALOG: tests/fixtures/catalog_inep.yml }
        run: |
          python scripts/generate_inep_fixtures.py --out data/landing
          python -m datahack_ingest pipeline
          python -m datahack_ingest pipeline
          python - <<'PY'
          import json
          m = json.load(open("outputs/_manifest.json"))
          assert m["version"] and m["sources"]["trajetoria"]["files"], m
          print({t["table"]: t["rows"] for t in m["tables"]})
          PY
      - name: Matriz de acesso (BI só lê a gold publicada)
        env: { PGPASSWORD: ci_bi_pw }
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U dh_bi_reader -d datahack -c "select count(*) from gold.p1_trajetoria_coorte"
          ! psql -h localhost -U dh_bi_reader -d datahack -c "select 1 from gold_candidate.p1_trajetoria_coorte limit 1"
          ! psql -h localhost -U dh_bi_reader -d datahack -c "select 1 from silver.stg_trajetoria limit 1"
          ! psql -h localhost -U dh_bi_reader -d datahack -c "select 1 from bronze.trajetoria limit 1"
          ! psql -h localhost -U dh_bi_reader -d datahack -c "create table gold.x (a int)"
      - name: Backup e restauração real em banco vazio (contagens e permissões)
        env: { PGHOST: localhost, PGDATABASE: datahack }
        run: |
          PGUSER=dh_backup PGPASSWORD=ci_backup_pw BACKUP_ONCE=true BACKUP_DIR=/tmp/backups bash infra/postgres/backup.sh
          PGUSER=dh_admin PGPASSWORD=ci_admin_pw bash infra/postgres/restore_check.sh /tmp/backups/datahack_*.dump
      - name: Documentação dbt (artefato)
        working-directory: dbt
        env: { DH_GOLD_SCHEMA: gold }
        run: dbt docs generate
      - uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: dbt/target/*.json
          retention-days: 7

  airflow:
    name: Parse das DAGs (Airflow 3.3.2)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - name: Instalar Airflow com constraints oficiais
        run: |
          pip install "apache-airflow[postgres]==3.3.2" apache-airflow-providers-fab \
            --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.12.txt
      - name: DagBag sem erros de importação
        env:
          AIRFLOW_HOME: /tmp/airflow
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
          AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/airflow/dags
          DH_HOME: ${{ github.workspace }}
        run: |
          airflow db migrate > /dev/null
          python - <<'EOF'
          import os, sys
          from airflow.dag_processing.dagbag import DagBag
          bag = DagBag(dag_folder=os.environ["AIRFLOW__CORE__DAGS_FOLDER"])
          if bag.import_errors:
              print(bag.import_errors); sys.exit(1)
          expected = {"medallion_pipeline", "warehouse_maintenance"}
          assert expected <= set(bag.dag_ids), bag.dag_ids
          print("DAGs OK:", sorted(bag.dag_ids))
          EOF

  lab:
    name: Fluxo do laboratório em Docker (up-lite + pipeline + outputs)
    runs-on: ubuntu-latest
    needs: lint
    env:
      RUN: docker compose run --rm -e DH_CATALOG=/opt/datahack/tests/catalog_inep.yml -v ./tests/fixtures:/opt/datahack/tests:ro cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - name: .env e imagem CLI
        run: |
          python scripts/init_env.py
          docker compose build cli
      - name: Postgres saudável e schema ops
        run: |
          docker compose up -d --wait warehouse
          $RUN python -m datahack_ingest init
          $RUN dbt debug --project-dir dbt
      - name: Pipeline com arquivos no layout do INEP
        run: |
          $RUN python scripts/generate_inep_fixtures.py --out data/landing
          $RUN python -m datahack_ingest pipeline
          $RUN python -m datahack_ingest pipeline
          test -s outputs/_manifest.json && cat outputs/_manifest.json
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --tail=200 warehouse

  image:
    name: Build da imagem (Airflow + ingest + dbt)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/airflow/Dockerfile
          push: false
          load: true
          tags: datahack/runtime:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test da imagem
        run: |
          docker build -f infra/cli/Dockerfile -t datahack/cli:ci .
          docker run --rm datahack/cli:ci python -m datahack_ingest --version
          docker run --rm datahack/cli:ci dbt --version
          docker run --rm --entrypoint python datahack/runtime:ci -m datahack_ingest --version
          docker run --rm --entrypoint dbt datahack/runtime:ci --version
          docker run --rm --entrypoint airflow datahack/runtime:ci version
