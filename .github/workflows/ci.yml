name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint, segredos e configuração
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Catálogo de fontes
        run: python -m datahack_ingest list && python -m datahack_ingest validate
      - name: Docker Compose (sintaxe e variáveis)
        run: |
          python scripts/init_env.py
          docker compose config -q
          docker compose --profile tools --profile bi --profile cli config -q
      - name: Gitleaks (varredura de segredos no histórico)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: Ingestão + dbt build + testes (PostgreSQL 16)
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: datahack
          POSTGRES_USER: dh_admin
          POSTGRES_PASSWORD: ci_admin_pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dh_admin -d datahack"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      WAREHOUSE_HOST: localhost
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_DB: datahack
      WAREHOUSE_INGEST_PASSWORD: ci_ingest_pw
      WAREHOUSE_DBT_PASSWORD: ci_dbt_pw
      DBT_PII_SALT: ci_salt
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
      DBT_TARGET: dev
      DH_LOG_FORMAT: json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -e ".[dev,dbt]"
      - name: Bootstrap do warehouse (roles, schemas, privilégios)
        env: { PGPASSWORD: ci_admin_pw }
        run: |
          psql -h localhost -U dh_admin -d datahack -c "CREATE EXTENSION IF NOT EXISTS pg_stat_statements" || true
          psql -v ON_ERROR_STOP=1 -h localhost -U dh_admin -d datahack \
            -v dbname=datahack -v ingest_pw=ci_ingest_pw -v dbt_pw=ci_dbt_pw -v bi_pw=ci_bi_pw \
            -v backup_pw=ci_backup_pw -v repl_pw=ci_repl_pw \
            -f infra/postgres/bootstrap.sql
          psql -q -v ON_ERROR_STOP=1 -h localhost -U dh_admin -d datahack \
            -v dbname=datahack -v ingest_pw=ci_ingest_pw -v dbt_pw=ci_dbt_pw -v bi_pw=ci_bi_pw \
            -v backup_pw=ci_backup_pw -v repl_pw=ci_repl_pw \
            -f infra/postgres/bootstrap.sql
      - name: Dados sintéticos
        run: python scripts/generate_sample_data.py --scale 0.3
      - name: Testes Python (unit + integração)
        run: pytest -q --cov=datahack_ingest --cov-report=term-missing
      - name: Ingestão (todas as fontes)
        run: python -m datahack_ingest run --all
      - name: Ingestão idempotente (reexecução não duplica)
        run: python -m datahack_ingest run --all
      - name: dbt build (models + 40+ testes de dados)
        working-directory: dbt
        run: dbt build
      - name: dbt build incremental (segunda execução)
        working-directory: dbt
        run: dbt build --select stg_vendas+
      - name: Matriz de acesso (bi_reader só lê gold)
        env: { PGPASSWORD: ci_bi_pw }
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U dh_bi_reader -d datahack -c "select count(*) from gold.fact_vendas"
          ! psql -h localhost -U dh_bi_reader -d datahack -c "select 1 from bronze.vendas limit 1"
          ! psql -h localhost -U dh_bi_reader -d datahack -c "select 1 from silver.stg_vendas limit 1"
          ! psql -h localhost -U dh_bi_reader -d datahack -c "create table gold.x (a int)"
      - name: Backup com role somente leitura e verificação de restauração
        env: { PGHOST: localhost, PGUSER: dh_backup, PGPASSWORD: ci_backup_pw, PGDATABASE: datahack }
        run: |
          BACKUP_ONCE=true BACKUP_DIR=/tmp/backups bash infra/postgres/backup.sh
          PGUSER=dh_admin PGPASSWORD=ci_admin_pw createdb -h localhost restore_check
          PGUSER=dh_admin PGPASSWORD=ci_admin_pw pg_restore --no-owner -h localhost -d restore_check /tmp/backups/datahack_*.dump || true
          test "$(PGUSER=dh_admin PGPASSWORD=ci_admin_pw psql -h localhost -d restore_check -tAc 'select count(*) from gold.fact_vendas')" -gt 0
      - name: Documentação dbt (artefato)
        working-directory: dbt
        run: dbt docs generate
      - uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: dbt/target/*.json
          retention-days: 7

  airflow:
    name: Parse das DAGs (Airflow 3.3.2)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - name: Instalar Airflow com constraints oficiais
        run: |
          pip install "apache-airflow[postgres]==3.3.2" apache-airflow-providers-fab \
            --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.12.txt
      - name: DagBag sem erros de importação
        env:
          AIRFLOW_HOME: /tmp/airflow
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
          AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/airflow/dags
          DH_HOME: ${{ github.workspace }}
        run: |
          airflow db migrate > /dev/null
          python - <<'EOF'
          import os, sys
          from airflow.dag_processing.dagbag import DagBag
          bag = DagBag(dag_folder=os.environ["AIRFLOW__CORE__DAGS_FOLDER"])
          if bag.import_errors:
              print(bag.import_errors); sys.exit(1)
          expected = {"medallion_pipeline", "warehouse_maintenance"}
          assert expected <= set(bag.dag_ids), bag.dag_ids
          print("DAGs OK:", sorted(bag.dag_ids))
          EOF

  image:
    name: Build da imagem (Airflow + ingest + dbt)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/airflow/Dockerfile
          push: false
          load: true
          tags: datahack/runtime:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test da imagem
        run: |
          docker run --rm --entrypoint python datahack/runtime:ci -m datahack_ingest --version
          docker run --rm --entrypoint dbt datahack/runtime:ci --version
          docker run --rm --entrypoint airflow datahack/runtime:ci version
