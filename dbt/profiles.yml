datahack:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('WAREHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('WAREHOUSE_PORT', '5433') | as_number }}"
      dbname: "{{ env_var('WAREHOUSE_DB', 'datahack') }}"
      user: "{{ env_var('WAREHOUSE_DBT_USER', 'dh_transformer') }}"
      password: "{{ env_var('WAREHOUSE_DBT_PASSWORD') }}"
      schema: silver
      threads: 4
      connect_timeout: 10
      retries: 2
      keepalives_idle: 30
      sslmode: "{{ env_var('WAREHOUSE_SSLMODE', 'prefer') }}"
    prod:
      type: postgres
      host: "{{ env_var('WAREHOUSE_HOST') }}"
      port: "{{ env_var('WAREHOUSE_PORT', '5432') | as_number }}"
      dbname: "{{ env_var('WAREHOUSE_DB') }}"
      user: "{{ env_var('WAREHOUSE_DBT_USER', 'dh_transformer') }}"
      password: "{{ env_var('WAREHOUSE_DBT_PASSWORD') }}"
      schema: silver
      threads: 8
      connect_timeout: 10
      retries: 3
      keepalives_idle: 30
      sslmode: "{{ env_var('WAREHOUSE_SSLMODE', 'prefer') }}"
