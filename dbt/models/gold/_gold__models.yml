version: 2

models:
  - name: dim_data
    description: Calendário com feriados nacionais (fixos + móveis via Páscoa) e chaves de LY.
    columns:
      - { name: data, data_type: date, constraints: [{ type: not_null }, { type: primary_key }], data_tests: [unique] }
      - { name: ano, data_type: int }
      - { name: trimestre, data_type: int }
      - { name: mes, data_type: int }
      - { name: nome_mes, data_type: text }
      - { name: ano_mes, data_type: text }
      - { name: primeiro_dia_mes, data_type: date }
      - { name: dia, data_type: int }
      - { name: dia_semana_iso, data_type: int, description: "1=segunda ... 7=domingo (ISO 8601)" }
      - { name: nome_dia_semana, data_type: text }
      - { name: semana_iso, data_type: int }
      - { name: ano_iso, data_type: int }
      - { name: is_fim_de_semana, data_type: boolean }
      - { name: is_feriado, data_type: boolean }
      - { name: nome_feriado, data_type: text }
      - { name: tipo_feriado, data_type: text }
      - { name: is_dia_util, data_type: boolean }
      - { name: data_ano_anterior, data_type: date, description: "Mesma data no ano anterior (LY calendário)." }
      - { name: data_mesmo_dia_semana_ano_anterior, data_type: date, description: "Data - 364 dias (LY varejo, mesmo dia da semana)." }

  - name: controle_atualizacao
    description: Última carga e última transformação por fonte — base do "Última atualização" no BI.
    columns:
      - { name: fonte, data_type: text, data_tests: [unique, not_null] }
      - { name: ultimo_status, data_type: text }
      - { name: ultima_carga_sucesso_local, data_type: timestamp }
      - { name: ultima_carga_sucesso_utc, data_type: timestamptz }
      - { name: linhas_ultima_execucao, data_type: bigint }
      - { name: linhas_rejeitadas_ultima_execucao, data_type: bigint }
      - { name: ultima_transformacao_local, data_type: timestamp }
      - { name: fuso_horario, data_type: text }

  - name: dh_catalogo_dados
    description: >
      Catálogo de dados das tabelas geradas automaticamente: tipo inferido, chave, classificação LGPD
      e perfil da amostra. Nenhum valor de dado é armazenado, apenas metadados.
    data_tests:
      - dh_unique_combination:
          arguments:
            combination_of_columns: [tabela_bronze, coluna_origem]
    columns:
      - { name: tabela_bronze, data_type: text, data_tests: [not_null] }
      - { name: fonte, data_type: text }
      - { name: tabela_silver, data_type: text }
      - { name: tabela_gold, data_type: text }
      - { name: coluna_origem, data_type: text, data_tests: [not_null] }
      - { name: coluna, data_type: text }
      - { name: ordem, data_type: integer }
      - name: tipo
        data_type: text
        data_tests:
          - accepted_values:
              arguments:
                values: [text, bigint, numeric, date, timestamp, timestamptz, boolean, jsonb]
      - { name: formato, data_type: text }
      - name: classificacao_lgpd
        data_type: text
        data_tests:
          - accepted_values:
              arguments:
                values: [nenhum, pessoal, identificador]
      - { name: is_pseudonimizada, data_type: boolean }
      - { name: is_chave, data_type: boolean }
      - { name: deduplicacao, data_type: text }
      - { name: materializacao, data_type: text }
      - { name: taxa_validos_amostra, data_type: numeric }
      - { name: taxa_nulos_amostra, data_type: numeric }
      - { name: taxa_distintos_amostra, data_type: numeric }
      - { name: tamanho_maximo, data_type: integer }
      - { name: linhas_amostra, data_type: bigint }
      - { name: linhas_bronze, data_type: bigint }
      - { name: perfilado_em, data_type: timestamptz }
      - { name: gerado_em, data_type: timestamptz }
