version: 2

sources:
  - name: bronze
    description: >
      Dado bruto gravado pelo datahack-ingest: todas as colunas de negócio como text,
      mais metadados técnicos (_dh_batch_id, _dh_ingested_at, _dh_source_file, _dh_row_hash).
    schema: bronze
    loaded_at_field: _dh_ingested_at
    freshness:
      warn_after: { count: 24, period: hour }
      error_after: { count: 72, period: hour }
    tables:
      - name: lojas
        description: Cadastro de lojas (carga full).
      - name: produtos
        description: Catálogo de produtos (merge por produto_id).
      - name: vendas
        description: Itens de venda (merge por venda_id + item_seq). Contém CPF — acesso restrito.
        meta: { pii: [cliente_cpf] }
      - name: metas
        description: Metas mensais por loja (carga full).
      - name: estoque_foto
        description: Fotos mensais de estoque (append-only).

  - name: ops
    description: Camada de controle e auditoria das ingestões.
    schema: ops
    tables:
      - name: ingestion_runs
        description: Uma linha por execução de ingestão (sucesso ou falha).
      - name: rejected_rows
        description: "Linhas em quarentena (ex.: chave primária nula)."
