version: 2

models:
  - name: stg_lojas
    description: Lojas tipadas e deduplicadas.
    columns:
      - name: loja_id
        description: Identificador da loja na origem.
        data_tests: [not_null, unique]
      - name: uf
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["AC","AL","AP","AM","BA","CE","DF","ES","GO","MA","MT","MS","MG","PA","PB","PR","PE","PI","RJ","RN","RS","RO","RR","SC","SP","SE","TO"]
      - name: data_inauguracao
        data_tests: [not_null]

  - name: stg_produtos
    description: Produtos com categoria achatada do JSON de origem.
    columns:
      - name: produto_id
        data_tests: [not_null, unique]
      - name: preco_lista
        data_tests:
          - dh_min_value:
              arguments: { min_value: 0 }

  - name: stg_vendas
    description: >
      Itens de venda tipados, deduplicados por (venda_id, item_seq), com CPF pseudonimizado
      (cliente_hash). Incremental com janela de lookback.
    data_tests:
      - dh_unique_combination:
          arguments:
            combination_of_columns: [venda_id, item_seq]
    columns:
      - name: venda_id
        data_tests: [not_null]
      - name: data_hora_venda
        data_tests: [not_null]
      - name: loja_id
        data_tests:
          - not_null
          - relationships:
              arguments: { to: ref('stg_lojas'), field: loja_id }
      - name: produto_id
        data_tests:
          - not_null
          - relationships:
              arguments: { to: ref('stg_produtos'), field: produto_id }
      - name: quantidade
        data_tests:
          - not_null
          - dh_min_value:
              arguments: { min_value: 0 }
      - name: canal
        data_tests:
          - accepted_values:
              arguments: { values: ["loja", "app", "site"] }
      - name: status
        data_tests:
          - accepted_values:
              arguments: { values: ["concluida", "cancelada"] }
      - name: cliente_hash
        description: SHA-256 (com salt) do CPF. O CPF original nunca sai da Bronze.

  - name: stg_metas
    description: Metas mensais (decimal pt-BR convertido).
    data_tests:
      - dh_unique_combination:
          arguments:
            combination_of_columns: [loja_id, mes]
    columns:
      - name: mes
        data_tests: [not_null]
      - name: valor_meta
        data_tests: [not_null]

  - name: stg_estoque_foto
    description: Foto de estoque deduplicada (a versão mais recente de cada foto).
    data_tests:
      - dh_unique_combination:
          arguments:
            combination_of_columns: [data_foto, loja_id, produto_id]
