version: 2

seeds:
  - name: feriados_fixos
    description: >
      Feriados nacionais de data fixa (Lei 662/1949, Lei 6.802/1980 e Lei 14.759/2023).
      Feriados móveis são calculados a partir da Páscoa em dim_data.
      Feriados estaduais/municipais: acrescente linhas com tipo_feriado = estadual/municipal.
    config:
      column_types:
        mes: smallint
        dia: smallint
        nome_feriado: text
        tipo_feriado: text
    columns:
      - name: tipo_feriado
        data_tests:
          - accepted_values:
              arguments:
                values: ["nacional", "estadual", "municipal", "ponto_facultativo"]
