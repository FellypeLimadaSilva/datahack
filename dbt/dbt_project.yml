name: datahack
version: "2.0.0"
config-version: 2
profile: datahack

model-paths: ["models"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages", "logs"]

vars:
  timezone: "America/Cuiaba"
  min_cell: 10
  min_base_ranking: 30
  uf_codigo: "51"
  p1_coorte: 2015
  ano_curso_comparacao: 4
  cpc_edicoes: [2021, 2022, 2023]
  censo_anos: [2021, 2022, 2023, 2024]

models:
  datahack:
    +persist_docs: { relation: true, columns: true }
    silver:
      +schema: silver
      +materialized: table
      +tags: ["silver"]
      +post-hook:
        - "analyze {{ this }}"
    gold:
      +schema: "{{ env_var('DH_GOLD_SCHEMA', 'gold_candidate') }}"
      +materialized: table
      +tags: ["gold"]
      +grants:
        select: ["{{ env_var('DBT_BI_ROLE', 'dh_bi_reader') }}"]
      +post-hook:
        - "analyze {{ this }}"

data_tests:
  datahack:
    +store_failures: false
